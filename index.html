<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypertube Video Stream Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .video-container {
            /* Increased max-width and set dynamic width */
            width: 90vw;
            max-width: 1200px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: auto;
            max-height: 80vh; /* Keeps player within screen height without clipping controls */
            display: block;
        }
    </style>
</head>
<body>

    <h2>BitTorrent Stream Testing</h2>
    
    <div class="video-container">
        <video controls crossorigin="anonymous">
            <source src="http://localhost:8080/movie/22b41b97f077f0d960ac60241b7423ad40420bdd" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

</body>
</html>
