<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypertube Video Stream Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .video-container {
            max-width: 800px;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <h2>BitTorrent Stream Testing</h2>
    
    <div class="video-container">
        <!-- 
            The controls attribute is required to show the play/pause/timeline. 
            The crossOrigin attribute can help prevent CORS issues if you serve 
            this HTML file from a different port than 8080 during development.
        -->
        <video controls crossorigin="anonymous">
            <source src="http://localhost:8080/movie/93935d4485cd09d45276fe1cea714605b1d4b09e" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

</body>
</html>
